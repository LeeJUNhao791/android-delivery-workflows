import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.2.10'
}

android {
    namespace 'io.github.leejunhao791.deliverydemo'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.leejunhao791.deliverydemo'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    debugImplementation 'io.github.webrtc-sdk:android:150.7871.01'
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('exportDebugAarManifest') {
    doLast {
        def runtime = configurations.getByName('debugRuntimeClasspath')
        def artifacts = runtime.incoming.artifacts.artifacts.findAll {
            it.id.componentIdentifier instanceof ModuleComponentIdentifier && it.file.name.endsWith('.aar')
        }.collect {
            def module = it.id.componentIdentifier
            [coordinate: "${module.group}:${module.module}:${module.version}".toString(),
             path: it.file.absolutePath]
        }.sort { it.coordinate }

        def manifest = layout.buildDirectory.file('reports/apk-16kb/resolved-aars.json').get().asFile
        manifest.parentFile.mkdirs()
        manifest.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
            consumer_configuration: "${project.path}:${runtime.name}".toString(),
            artifacts: artifacts
        ])) + '\n', 'UTF-8')
    }
}
