plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.2.10'
}

android {
    namespace 'io.github.leejunhao791.deliverydemo'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.leejunhao791.deliverydemo'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    debugImplementation 'io.github.webrtc-sdk:android:150.7871.01'
    testImplementation 'junit:junit:4.13.2'
}
