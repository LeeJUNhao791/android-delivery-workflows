name: Android delivery CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Test BLE recovery and build the examples
        working-directory: examples/android-app
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease \
            :upgrade-demo:assembleBaselineDebug :upgrade-demo:assembleCandidateDebug
      - name: Test ADB upgrade and diagnosis logic
        run: python -B -m unittest discover -s tools/adb-upgrade/tests -v
      - name: Prepare demo candidate
        run: python examples/android-app/prepare-demo.py
      - name: Download and verify bundletool
        run: bash tools/aab-preflight/setup-bundletool.sh
      - name: Test signed, unsigned, modified and misconfigured candidates
        run: python -B -m unittest discover -s tools/aab-preflight/tests -v
      - name: Record the duplicate-version result
        run: |
          status=0
          python tools/aab-preflight/preflight.py build/demo/candidate.aab \
            --expect build/demo/repeat-version.json --report-dir build/repeat-version || status=$?
          test "$status" -eq 1
      - name: Upload rejection report
        uses: actions/upload-artifact@v7
        with:
          name: repeat-version-report
          path: build/repeat-version/
          if-no-files-found: error
      - name: Upload candidate for the reusable workflow
        uses: actions/upload-artifact@v7
        with:
          name: demo-candidate
          path: |
            build/demo/candidate.aab
            build/demo/release.json
          if-no-files-found: error

  preflight:
    needs: example
    uses: ./.github/workflows/aab-preflight.yml
    with:
      artifact-name: demo-candidate

  webrtc:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/webrtc-preview
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm test
      - run: node run.mjs ../../build/webrtc-preview
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webrtc-preview-report
          path: build/webrtc-preview/report.json
          if-no-files-found: warn

  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/flutter-preview
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - name: Install Android build dependencies
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --debug --no-pub --target-platform android-arm64
